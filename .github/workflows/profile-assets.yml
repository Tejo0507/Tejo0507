name: Build profile assets

# Regenerates every image the README pulls from the `output` branch:
# the gh-ascii card, the 3D contribution calendar and the Pac-Man graph.

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # v5.0.0's A* pathing runs the runner out of heap; v3.2.8 is the last release before it.
      - name: Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v3.2.8
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Falls back to the copies committed on main if the generator is down.
      - name: gh-ascii card
        run: |
          mkdir -p dist
          for theme in dark light; do
            curl -fsSL --retry 3 "https://gh.crafter.run/${{ github.repository_owner }}?theme=${theme}" \
              -o "dist/${theme}_mode.svg" || cp "${theme}_mode.svg" "dist/${theme}_mode.svg"
          done

      - name: Collect
        run: |
          mv profile-3d-contrib dist/
          # Keep yesterday's Pac-Man graph if today's generation failed.
          for f in pacman-contribution-graph.svg pacman-contribution-graph-dark.svg; do
            [ -f "dist/$f" ] || curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/$f" -o "dist/$f" || true
          done
          ls -R dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
